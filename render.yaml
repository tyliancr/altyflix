services:
  - type: web
    name: altyflix-backend
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --omit=dev
    startCommand: node server/server-vf-api.cjs
    envVars:
      - key: NODE_ENV
        value: production
      - key: TMDB_API_KEY
        sync: false
      - key: DEBRID_TOKEN
        sync: false
