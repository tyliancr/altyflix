[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "24"
  VITE_FIREBASE_API_KEY = "AIzaSyAsYvCQOr0cxPLEFrjd39UCnUirwihjgG4"
  VITE_FIREBASE_AUTH_DOMAIN = "atflix-39c32.firebaseapp.com"
  VITE_FIREBASE_PROJECT_ID = "atflix-39c32"
  VITE_FIREBASE_STORAGE_BUCKET = "atflix-39c32.firebasestorage.app"
  VITE_FIREBASE_MESSAGING_SENDER_ID = "492409810550"
  VITE_FIREBASE_APP_ID = "1:492409810550:web:2c177061482acb1b38f957"
  VITE_FIREBASE_MEASUREMENT_ID = "G-FEPTB7QJRK"

# Proxy transparent vers le backend Node.js hébergé sur Render
[[redirects]]
  from = "/api/*"
  to = "https://altyflix-backend.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/avatars/Netflix/*"
  to = "/avatars/netflix/:splat"
  status = 301

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Permissions-Policy = "fullscreen=*, picture-in-picture=*, autoplay=*, camera=(), microphone=(self), geolocation=(), payment=()"
    X-Frame-Options = "DENY"
    Content-Security-Policy = "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'"
    X-Content-Type-Options = "nosniff"
    X-XSS-Protection = "1; mode=block"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Strict-Transport-Security = "max-age=31536000"
