  node_bundler = "esbuild"

[build.environment]
  NODE_VERSION = "24"
  VITE_FIREBASE_API_KEY = "AIzaSyAsYvCQOr0cxPLEFrjd39UCnUirwihjgG4"
  VITE_FIREBASE_AUTH_DOMAIN = "atflix-39c32.firebaseapp.com"
  VITE_FIREBASE_PROJECT_ID = "atflix-39c32"
  VITE_FIREBASE_STORAGE_BUCKET = "atflix-39c32.firebasestorage.app"
  VITE_FIREBASE_MESSAGING_SENDER_ID = "492409810550"
  VITE_FIREBASE_APP_ID = "1:492409810550:web:2c177061482acb1b38f957"
  VITE_FIREBASE_MEASUREMENT_ID = "G-FEPTB7QJRK"
  VITE_DEBRID_PROVIDER = "torbox"
