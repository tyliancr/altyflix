services:
  - type: web
    name: altyflix-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: DEBRID_PROVIDER
        value: torbox
      - key: DEBRID_TOKEN
        sync: false
      - key: TMDB_API_KEY
        sync: false
